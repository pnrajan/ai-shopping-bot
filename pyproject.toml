[project]
name = "personal-shopper"
version = "0.1.0"
description = "FastAPI skeleton for a personal shopping assistant chat API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pankaj Rajan" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
