[project]
name = "ai-shopping-bot"
version = "0.3.0"
description = "FastAPI personal shopping assistant: query understanding, product search, refinement, and comparison over a staged pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pankaj Rajan" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "pydantic>=2.14.3,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "openai>=1.60,<3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.17.5",
    "import-linter>=2.0",
    "vulture>=2.11",
]
redis = ["redis>=5.0"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "G", "C90", "PLR0915", "SIM", "RET"]
per-file-ignores = { "tests/*" = ["PLR0915", "E501"], "ai_shopping_bot/api/app.py" = ["BLE001", "B008"], "ai_shopping_bot/api/tracking_routes.py" = ["B008"] }

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ai_shopping_bot"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "ai_shopping_bot"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "ai_shopping_bot.api",
    "ai_shopping_bot.pipeline",
    "ai_shopping_bot.stages",
    "ai_shopping_bot.tools",
    "ai_shopping_bot.search",
    "ai_shopping_bot.session | ai_shopping_bot.cache | ai_shopping_bot.tracking",
    "ai_shopping_bot.providers | ai_shopping_bot.llm",
    "ai_shopping_bot.contracts",
]

[tool.vulture]
min_confidence = 80
paths = ["ai_shopping_bot"]
