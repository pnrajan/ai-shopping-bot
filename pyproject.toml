[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inflection-curator"
version = "1.0.0"
description = "AI-powered personal shopping assistant with multi-provider product search"
readme = "README.md"
license = {text = "Copyright (c) 2024 InflectionAI. All rights reserved."}
authors = [
    {name = "Inflection Team", email = "team@inflection.ai"}
]
maintainers = [
    {name = "Pankaj Rajan", email = "pankaj@inflection.ai"}
]
keywords = [
    "ai",
    "shopping",
    "assistant",
    "product-search",
    "intent-classification",
    "e-commerce",
    "chatbot",
    "nlp",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
requires-python = ">=3.8"
dependencies = [
    # Core Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # HTTP & Networking
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",

    # AI & Machine Learning
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "tokenizers>=0.15.0",
    "numpy>=1.24.0",
    "litellm>=1.0.0",
    "pyyaml>=6.0",

    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "dynaconf>=3.2.0",

    # Data Processing
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "typing-extensions>=4.8.0",

    # Security & Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",

    # Logging
    "structlog>=23.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# AI Providers
ai = [
    "openai>=1.3.0",
]

# Database Support
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
]

# Caching
cache = [
    "redis>=5.0.0",
    "cachetools>=5.3.0",
]

# Development Tools
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.20.0",

    # Code Quality
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",

    # Development Environment
    "ipython>=8.17.0",
    "jupyter>=1.0.0",

    # Security Analysis
    "bandit>=1.7.5",
    "safety>=2.3.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

# Production Deployment
prod = [
    "gunicorn>=21.2.0",
    "supervisor>=4.2.0",
    "sentry-sdk>=1.38.0",
]

# Performance Monitoring
monitoring = [
    "prometheus-client>=0.19.0",
    "memory-profiler>=0.61.0",
    "py-spy>=0.3.14",
]

# Load Testing
testing = [
    "locust>=2.17.0",
]

# Web Scraping (if needed)
scraping = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "selenium>=4.15.0",
]

# Image Processing
images = [
    "Pillow>=10.1.0",
]

# Background Tasks
tasks = [
    "celery>=5.3.0",
    "rq>=1.15.0",
]

# All optional dependencies
all = [
    "inflection-curator[ai,db,cache,dev,docs,prod,monitoring,scraping,images,tasks]"
]

[project.urls]
Homepage = "https://github.com/inflection-ai/curator"
Documentation = "https://inflection-curator.readthedocs.io/"
Repository = "https://github.com/inflection-ai/curator"
Issues = "https://github.com/inflection-ai/curator/issues"
Changelog = "https://github.com/inflection-ai/curator/blob/main/CHANGELOG.md"

[project.scripts]
inflection-curator = "main:cli"

[tool.setuptools]
packages = ["inflection_curator"]
include-package-data = true

[tool.setuptools.package-data]
inflection_curator = ["personas/configs/**/*.yaml", "personas/configs/**/*.yml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "S608"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "numpy.*",
    "redis.*",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests that require API keys",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = ["B101", "B601"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["inflection_curator"]
known_third_party = ["fastapi", "pydantic", "transformers", "torch", "litellm"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true

[tool.semantic_release]
version_toml = "pyproject.toml:project.version"
version_variable = "inflection_curator/__init__.py:__version__"
build_command = "pip install build && python -m build"

# Development Environment Configuration
[tool.pyproject-fmt]
keep_full_version = true

# Docker Configuration (if using)
[tool.docker]
image_name = "inflection-curator"
dockerfile = "Dockerfile"
build_args = {PYTHON_VERSION = "3.11"}

# Environment Variables for Development
[tool.dotenv]
override = false
verbose = true
