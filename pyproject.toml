[project]
name = "personal-shopper"
version = "0.2.0"
description = "FastAPI skeleton for a personal shopping assistant chat API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pankaj Rajan" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.163.0,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "pydantic>=2.14.3,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "httpx2>=2.16.0", "ruff>=0.17.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
