title: AI Shopping Bot
description: A conversational shopping assistant API. One LLM call to understand a turn, refinement without re-searching, side-by-side comparisons.
url: https://pnrajan.github.io
baseurl: /ai-shopping-bot
repository: pnrajan/ai-shopping-bot
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
