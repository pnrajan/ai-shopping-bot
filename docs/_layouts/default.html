<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-doc{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav" id="top">
    <div class="wrap nav__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>AI Shopping Bot</span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="{{ '/#pipeline' | relative_url }}">Pipeline</a>
        <a href="{{ '/#playground' | relative_url }}">Playground</a>
        <a href="{{ '/#models' | relative_url }}">Models</a>
        <a href="{{ '/ARCHITECTURE.html' | relative_url }}">Architecture</a>
        <a href="{{ '/DEPLOYMENT.html' | relative_url }}">Deploy</a>
        <a href="{{ '/BENCHMARKS.html' | relative_url }}">Benchmarks</a>
        <a class="btn btn--ghost btn--sm" href="https://github.com/{{ site.repository }}" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <main id="main">
    {% if page.url == '/' %}
      {{ content }}
    {% else %}
      <article class="wrap prose">
        <p class="crumb"><a href="{{ '/' | relative_url }}">Home</a> <span aria-hidden="true">/</span> {{ page.title | default: page.name }}</p>
        {{ content }}
      </article>
    {% endif %}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>MIT © Pankaj Rajan</span>
      <span class="footer__links">
        <a href="https://github.com/{{ site.repository }}" rel="noopener">Source</a>
        <a href="https://github.com/{{ site.repository }}/actions/workflows/ci.yml" rel="noopener">CI</a>
        <a href="https://github.com/{{ site.repository }}/blob/main/CONTRIBUTING.md" rel="noopener">Contributing</a>
      </span>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
