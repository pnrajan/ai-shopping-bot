name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: vulture shopper --min-confidence 80
      - run: bash scripts/check_root_clutter.sh
      - run: bash scripts/check_model_names.sh
      - run: pytest --cov=shopper --cov-fail-under=80
